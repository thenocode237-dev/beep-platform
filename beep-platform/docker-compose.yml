name: beep

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  proxy:
    <<: *common
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BEEP_SITE: ${BEEP_DOMAIN}
      BO_SITE: dashboard.${BEEP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      REDIRECT_UPSTREAMS: ${REDIRECT_UPSTREAMS:-redirector:8080}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [core, redirector, web, backoffice-api, backoffice-web]

  # ---------- PostgreSQL (deux bases : beep, backoffice) ----------
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_SUPERUSER}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      BEEP_DB_PASSWORD: ${BEEP_DB_PASSWORD}
      BO_DB_PASSWORD: ${BO_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- beep-core (Java) ----------
  core-migrate:                         # one-shot : Flyway puis arrêt (même image que `core`, construite une seule fois)
    image: beep/core:${BEEP_VERSION:-dev}
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      SPRING_DATASOURCE_URL: ${BEEP_DATABASE_DIRECT_URL:-jdbc:postgresql://postgres:5432/beep}
      SPRING_DATASOURCE_USERNAME: beep_app
      SPRING_DATASOURCE_PASSWORD: ${BEEP_DB_PASSWORD}
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  core:
    <<: *common
    image: beep/core:${BEEP_VERSION:-dev}
    build: { context: ., dockerfile: beep/core/Dockerfile }
    environment: &core-env
      SPRING_PROFILES_ACTIVE: prod
      BEEP_SERVICE_ROLE: api
      BEEP_DATABASE_DIRECT_URL: ${BEEP_DATABASE_DIRECT_URL:-jdbc:postgresql://postgres:5432/beep}
      BEEP_READ_REPLICA_URL: ${BEEP_READ_REPLICA_URL:-}
      BEEP_READ_REPLICA_USER: ${BEEP_READ_REPLICA_USER:-}
      BEEP_READ_REPLICA_PASSWORD: ${BEEP_READ_REPLICA_PASSWORD:-}
      BEEP_SSO_ALLOWED_HOSTS: ${BEEP_SSO_ALLOWED_HOSTS:-}
      BEEP_REGION: ${BEEP_REGION:-local}
      BEEP_EVENT_STORE: ${BEEP_EVENT_STORE:-postgres}
      SPRING_DATASOURCE_URL: ${BEEP_DATABASE_URL:-jdbc:postgresql://postgres:5432/beep}
      SPRING_DATASOURCE_USERNAME: beep_app
      SPRING_DATASOURCE_PASSWORD: ${BEEP_DB_PASSWORD}
      MANAGEMENT_SERVER_PORT: "8090"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      BEEP_PUBLIC_URL: ${BEEP_PUBLIC_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_API_TOKEN_NEXT: ${ADMIN_API_TOKEN_NEXT:-}     # rotation : second jeton accepté pendant la transition
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      BEEP_CONVERSION_SECRET: ${BEEP_CONVERSION_SECRET:-${TOTP_ENCRYPTION_KEY}}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Beep <no-reply@beep.localhost>}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}               # bêta privée : inscription sur invitation (open : libre)
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}                  # base MaxMind Country (.mmdb) montée en lecture seule ; vide = pays inconnus
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      URL_SAFETY_PROVIDER: ${URL_SAFETY_PROVIDER:-web_risk}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      PAYMENT_SANDBOX_SECRET: ${PAYMENT_SANDBOX_SECRET:-sandbox-secret}
      NOTCHPAY_BASE_URL: ${NOTCHPAY_BASE_URL:-https://api.notchpay.co}
      NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY:-}
      NOTCHPAY_HASH_KEY: ${NOTCHPAY_HASH_KEY:-}
      BILLING_VAT_RATES: ${BILLING_VAT_RATES:-CM=1925,GA=1800}
      BILLING_DEFAULT_COUNTRY: ${BILLING_DEFAULT_COUNTRY:-CM}
      BILLING_SELLER_NAME: ${BILLING_SELLER_NAME:-Beep}
      BILLING_SELLER_ADDRESS: ${BILLING_SELLER_ADDRESS:-}
      BILLING_SELLER_TAX_ID: ${BILLING_SELLER_TAX_ID:-}
      DOMAINS_CNAME_TARGET: ${DOMAINS_CNAME_TARGET:-beep.localhost}
      DOMAINS_ALLOWED_IPS: ${DOMAINS_ALLOWED_IPS:-}
      DOMAINS_DNS_RESOLVER: ${DOMAINS_DNS_RESOLVER:-}
      WEB_RISK_API_KEY: ${WEB_RISK_API_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      BEEP_ROLLUP_INTERVAL: ${BEEP_ROLLUP_INTERVAL:-PT1M}
    networks: [edge, backend, db]
    depends_on:
      core-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s


  redirector:
    <<: *common
    image: beep/core:${BEEP_VERSION:-dev}
    environment:
      <<: *core-env
      BEEP_SERVICE_ROLE: redirector
    networks: [edge, db]
    depends_on:
      core-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  worker:                               # même image, rôle « tâches de fond »
    <<: *common
    image: beep/core:${BEEP_VERSION:-dev}
    environment:
      <<: *core-env
      SPRING_PROFILES_ACTIVE: prod,worker
      BEEP_SERVICE_ROLE: worker
    networks: [edge, db]                # edge : accès sortant (e-mails, webhooks, paiements)
    depends_on:
      core: { condition: service_healthy }

  web:
    <<: *common
    image: beep/web:${BEEP_VERSION:-dev}
    build:
      context: .
      dockerfile: beep/web/Dockerfile
      args:
        BEEP_PUBLIC_URL: ${BEEP_PUBLIC_URL:-http://beep.localhost}
    environment:
      CORE_INTERNAL_URL: http://core:8080/v1                 # rendu serveur (SSR)
      BEEP_PUBLIC_URL: ${BEEP_PUBLIC_URL}
      SUPPORT_WHATSAPP: ${SUPPORT_WHATSAPP:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      LEGAL_PUBLISHER: ${LEGAL_PUBLISHER:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_REGISTRATION: ${LEGAL_REGISTRATION:-}
      LEGAL_CONTACT: ${LEGAL_CONTACT:-}
      LEGAL_HOST: ${LEGAL_HOST:-}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- back office ----------
  backoffice-migrate:                   # one-shot : même image que `backoffice-api`
    image: beep/backoffice-api:${BEEP_VERSION:-dev}
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backoffice
      SPRING_DATASOURCE_USERNAME: bo_app
      SPRING_DATASOURCE_PASSWORD: ${BO_DB_PASSWORD}
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }

  backoffice-api:
    <<: *common
    image: beep/backoffice-api:${BEEP_VERSION:-dev}
    build: ./backoffice/api
    environment: &bo-env
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/backoffice
      SPRING_DATASOURCE_USERNAME: bo_app
      SPRING_DATASOURCE_PASSWORD: ${BO_DB_PASSWORD}
      SERVER_PORT: "8081"
      MANAGEMENT_SERVER_PORT: "8091"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      BO_PUBLIC_URL: ${BO_PUBLIC_URL}
      BO_ENCRYPTION_KEY: ${BO_ENCRYPTION_KEY}
      CORE_ADMIN_URL: http://core:8080/internal/admin/v1
      CORE_ADMIN_TOKEN: ${ADMIN_API_TOKEN}
    networks: [edge, backend, db]
    depends_on:
      backoffice-migrate: { condition: service_completed_successfully }
      core: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s

  backoffice-web:
    <<: *common
    image: beep/backoffice-web:${BEEP_VERSION:-dev}
    build: { context: ., dockerfile: backoffice/web/Dockerfile }
    environment:
      BO_API_INTERNAL_URL: http://backoffice-api:8081/api    # rendu serveur (SSR)
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  edge:         # exposé au proxy, accès sortant autorisé
  backend:      # core <-> backoffice-api, jamais publié
    internal: true
  db:           # PostgreSQL uniquement, jamais publié
    internal: true

volumes:
  pg_data:
  caddy_data:
  caddy_config:
