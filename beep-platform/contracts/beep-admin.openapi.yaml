openapi: 3.1.0
info:
  title: Beepclick — API admin interne
  version: 0.9.0   # SemVer. Additif = mineure ; cassant = nouvelle base /internal/admin/v2 + un cycle de coexistence.
  description: |
    Contrat entre `beep-core` (serveur) et `backoffice-api` (client). Source de vérité unique :
    on modifie ce fichier EN PREMIER, puis le core et le client.

    - Exposée uniquement sur le réseau Docker `backend` ; jamais routée par Caddy.
    - Authentification : jeton de service (`Authorization: Bearer`). Deux jetons sont acceptés pendant une rotation.
    - `X-Staff-Id` : identifiant du membre du staff à l'origine de l'appel (journalisé des deux côtés).
    - Erreurs : `application/problem+json` avec un champ `code` stable.
    - Listes paginées par curseur.

    Historique : 0.1.0 (phase 0) utilisateurs en lecture ; 0.2.0 (phase 1) recherche, fiche et suspension de compte,
    liens (recherche, désactivation), slugs réservés, plans et overrides de droits, métriques plateforme, jobs ;
    0.3.0 (phase 2, cycle 4) facturation : abonnements, paiements, échéances, MRR/ARR, paiements manuels, changement de plan manuel,
    coupons, factures, publication de plans versionnés (prix trimestriel / annuel ajoutés à `Plan`) ;
    0.4.0 (phase 2, cycle 5) domaines personnalisés : liste globale, état DNS/TLS, relance de la vérification, blocage ;
    0.5.0 (phase 2, cycle 6) catalogue d'applications (deeplinks) : lecture, publication versionnée, activation, test en direct ;
    0.6.0 (phase 2) signalements, modération, liste noire, feature flags et export/suppression de compte ;
    0.7.0 (phase 3) pipeline de conversion, clés API, livraisons, limites et droits des visiteurs.
    Les invitations (inscription sur invitation) ont été retirées avec la fin de la phase de lancement : l'inscription est ouverte.
servers:
  - url: http://core:8080/internal/admin/v1
security:
  - serviceToken: []
paths:
  /developer/monitor: {"get":{"operationId":"developerMonitor","summary":"Débit, refus, volume et erreurs API, livraisons et retard","responses":{"200":{"description":"Résultat","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeveloperMonitor"}}}}}}}
  /developer/workspaces/{workspaceId}: {"parameters":[{"name":"workspaceId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"get":{"operationId":"developerWorkspace","summary":"Clés sans secrets, configuration et journal de livraisons","responses":{"200":{"description":"Résultat","content":{"application/json":{"schema":{"$ref":"#/components/schemas/DeveloperWorkspace"}}}},"404":{"$ref":"#/components/responses/NotFound"}}}}
  /developer/workspaces/{workspaceId}/actions: {"parameters":[{"name":"workspaceId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"post":{"operationId":"developerAction","summary":"Révocation, rejeu, limites et droits du visiteur (audité)","parameters":[{"$ref":"#/components/parameters/StaffId"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["action","reason"],"properties":{"action":{"type":"string","enum":["revoke","replay","limits","visitor.export","visitor.erase"]},"id":{"type":"string"},"reason":{"type":"string","minLength":3,"maxLength":1000},"rpm":{"type":"integer","minimum":0,"maximum":1000000},"events":{"type":"integer","minimum":0,"maximum":1000000}}}}}},"responses":{"200":{"description":"Résultat","content":{"application/json":{"schema":{"type":"object","additionalProperties":true}}}}}}}

  /moderation/reports:
    get:
      operationId: listAbuseReports
      summary: Lister les signalements et leur retard de traitement
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [open, dismissed, blocked]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Signalements, plus anciens en premier (SLA 24 h)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reports'}
  /moderation/reports/{id}/resolve:
    post:
      operationId: resolveAbuseReport
      summary: Classer un signalement ou bloquer sa destination
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/StaffId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [dismissed, blocked]}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200':
          description: Signalement traité
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AbuseReport'}
        '409': {$ref: '#/components/responses/Conflict'}
  /moderation/blocklist:
    get:
      operationId: listBlockedHosts
      summary: Lister les hôtes bloqués
      responses:
        '200':
          description: Hôtes bloqués (inclut les sous-domaines)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockedHosts'}
  /moderation/blocklist/{host}:
    put:
      operationId: setBlockedHost
      summary: Bloquer ou débloquer un hôte et ses sous-domaines
      parameters:
        - {name: host, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/StaffId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked, reason]
              properties:
                blocked: {type: boolean}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200':
          description: Liste mise à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockedHosts'}
  /feature-flags:
    get:
      operationId: listFeatureFlags
      summary: Lister les feature flags publiés
      responses:
        '200':
          description: Flags publiés
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFlags'}
  /feature-flags/{key}:
    put:
      operationId: publishFeatureFlag
      summary: Publier une version de feature flag
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/StaffId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, rolloutPercent, reason, version]
              properties:
                enabled: {type: boolean}
                rolloutPercent: {type: integer, minimum: 0, maximum: 100}
                reason: {type: string, minLength: 3, maxLength: 1000}
                version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Flag publié (version optimiste)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FeatureFlag'}
        '409': {$ref: '#/components/responses/Conflict'}
  /users/{id}/export:
    post:
      operationId: exportUserData
      summary: Exporter les données portables d’un compte
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/StaffId'}
      responses:
        '200':
          description: Export portable, sans secrets ni empreintes visiteurs
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /users/{id}/erase:
    post:
      operationId: eraseUserData
      summary: Effacer un compte et archiver ses pièces comptables
      parameters:
        - {$ref: '#/components/parameters/Id'}
        - {$ref: '#/components/parameters/StaffId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200':
          description: Compte effacé ; pièces comptables conservées séparément
          content:
            application/json:
              schema:
                type: object
                required: [erased]
                properties:
                  erased: {type: boolean}
  /meta:
    get:
      operationId: getMeta
      summary: Version du contrat implémentée par le core
      description: Le back office la compare à sa version minimale requise au démarrage.
      responses:
        "200":
          description: Version du contrat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
              example: { contract: "0.6.0" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      operationId: listUsers
      summary: Liste des utilisateurs (lecture seule, plus récents d'abord)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Recherche sur l'adresse e-mail (sous-chaîne, insensible à la casse). Ajouté en 0.2.0.
          schema: { type: string, maxLength: 254 }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Une page d'utilisateurs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsersPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{id}:
    get:
      operationId: getUser
      summary: Fiche d'un utilisateur et de son workspace (plan, usage face aux quotas, overrides)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Fiche détaillée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/status:
    patch:
      operationId: setUserStatus
      summary: Suspendre ou réactiver un compte
      description: |
        Suspension : connexion impossible, sessions révoquées, workspace suspendu (ses liens et pages affichent une page
        d'information au lieu de rediriger). Réactivation : retour à l'état actif.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusChange" }
      responses:
        "200":
          description: Utilisateur après changement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /links:
    get:
      operationId: listLinks
      summary: Recherche de liens (tous workspaces)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Sous-chaîne recherchée dans le slug, la destination ou l'e-mail du propriétaire.
          schema: { type: string, maxLength: 254 }
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Une page de liens, plus récents d'abord
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinksPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /links/{id}:
    get:
      operationId: getLink
      summary: Un lien et son propriétaire
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Le lien
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /links/{id}/disable:
    post:
      operationId: disableLink
      summary: Désactiver un lien (page d'avertissement, plus aucune redirection)
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reason" }
      responses:
        "200":
          description: Le lien désactivé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /links/{id}/enable:
    post:
      operationId: enableLink
      summary: Réactiver un lien désactivé
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Le lien réactivé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reserved-slugs:
    get:
      operationId: listReservedSlugs
      summary: Slugs réservés (chemins du site, routes techniques, noms protégés)
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Liste triée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservedSlugs" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /plans:
    get:
      operationId: listPlans
      summary: Plans publiés et leurs droits
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlansList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /workspaces/{id}/entitlements:
    put:
      operationId: setEntitlementOverrides
      summary: Overrides de droits d'un workspace (ex. +50 liens offerts)
      description: |
        Chaque clé fournie remplace l'override existant ; `null` le supprime (retour à la valeur du plan).
        Les clés absentes ne changent pas. `-1` signifie « illimité » ; pour une fonctionnalité, 0 ou 1.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverridesChange" }
      responses:
        "200":
          description: Droits effectifs et overrides après modification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEntitlements" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /metrics:
    get:
      operationId: getMetrics
      summary: Métriques plateforme v1
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Métriques
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformMetrics" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs:
    get:
      operationId: listJobs
      summary: État des tâches de fond (worker)
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /billing/summary:
    get:
      operationId: getBillingSummary
      summary: Abonnements par état, MRR / ARR, encaissements des 30 derniers jours
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Synthèse de facturation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /billing/subscriptions:
    get:
      operationId: listSubscriptions
      summary: Abonnements (échéance la plus lointaine d'abord), filtrables par état ; `grace` = impayés
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [trialing, active, grace, expired] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Abonnements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionsList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /billing/upcoming:
    get:
      operationId: listUpcomingRenewals
      summary: Échéances à venir (périodes payées et essais), les plus proches d'abord
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 14 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Échéances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /billing/payments:
    get:
      operationId: listPayments
      summary: Paiements (plus récents d'abord)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, succeeded, failed, refunded] }
        - name: workspaceId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Une page de paiements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /billing/invoices/{number}/pdf:
    get:
      operationId: getInvoicePdf
      summary: Facture au format PDF
      parameters:
        - name: number
          in: path
          required: true
          schema: { type: string, pattern: "^BEEP-\\d{4}-\\d{6}$" }
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/invoices:
    get:
      operationId: listWorkspaceInvoices
      summary: Factures d'un workspace
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Factures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicesList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /workspaces/{id}/payments:
    post:
      operationId: recordManualPayment
      summary: Enregistre un paiement hors ligne (virement, espèces)
      description: |
        Prolonge l'abonnement comme un paiement en ligne, émet la facture et envoie le reçu. Le plan peut ne pas être commercialisé
        (décision explicite du staff). Erreurs : `invalid_amount`, `plan_not_purchasable`, `invalid_cycle`, `unsupported_country`.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPayment" }
      responses:
        "201":
          description: Paiement enregistré et facture émise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualPaymentResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /workspaces/{id}/plan:
    put:
      operationId: changeWorkspacePlan
      summary: Changement de plan manuel (période offerte, ou retour à Starter)
      description: >-
        Plan payant : `until` (futur, au plus 5 ans) obligatoire. `starter` : retour immédiat, sans message d'expiration.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanChange" }
      responses:
        "200":
          description: Abonnement après modification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /coupons:
    get:
      operationId: listCoupons
      summary: Coupons (plus récents d'abord)
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Coupons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponsList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCoupon
      summary: Crée un coupon (remise en % OU en montant fixe)
      parameters:
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CouponCreate" }
      responses:
        "201":
          description: Coupon créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /coupons/{code}/active:
    put:
      operationId: setCouponActive
      summary: Active ou désactive un coupon
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              additionalProperties: false
              properties:
                active: { type: boolean }
      responses:
        "200":
          description: Coupon après modification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /plans/{code}:
    put:
      operationId: publishPlan
      summary: Publie une nouvelle version d'un plan (création si le code est nouveau)
      description: |
        Le brouillon est édité dans le back office ; la publication remplace la copie lue à l'exécution par le core et incrémente la
        version. Prix trimestriel / annuel absents : calculés (−10 % / −30 %). `starter` reste gratuit et public.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9_-]{1,31}$" }
        - $ref: "#/components/parameters/StaffId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanPublish" }
      responses:
        "200":
          description: Plan publié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /domains:
    get:
      operationId: listDomains
      summary: Domaines personnalisés de tous les workspaces (plus récents d'abord)
      parameters:
        - name: q
          in: query
