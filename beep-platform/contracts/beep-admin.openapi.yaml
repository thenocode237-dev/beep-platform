          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Paramètre ou corps invalide (ex. curseur falsifié, clé de droit inconnue)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ressource inconnue (code `not_found`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Transition impossible (ex. compte déjà dans cet état, adresse déjà inscrite)
