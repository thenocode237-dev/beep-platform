components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Curseur opaque renvoyé par la page précédente (`nextCursor`).
      schema: { type: string }
    StaffId:
      name: X-Staff-Id
      in: header
      description: Membre du staff à l'origine de l'appel.
      schema: { type: string, format: uuid }
  schemas:
    EnterpriseContract:
      type: object
      required:
        - version
        - reference
        - status
        - startsAt
        - endsAt
        - slaBp
        - dpaReference
        - dpaSha256
        - retentionDays
        - ipAllowlist
        - brandName
        - brandColor
        - sso
      properties:
        workspaceId: &a4
          type: string
          format: uuid
        version: &a5
          type: integer
          minimum: 1
        reference: &a6
          type: string
          minLength: 3
          maxLength: 200
        status: &a7
          enum:
            - active
            - suspended
            - expired
        startsAt: &a1
          type: string
          format: date-time
        endsAt: *a1
        slaBp: &a8
          type: integer
          minimum: 9000
          maximum: 10000
        dpaReference: &a9
          type: string
          minLength: 3
          maxLength: 200
        dpaSha256: &a10
          type: string
          pattern: ^[a-f0-9]{64}$
        retentionDays: &a11
          type: integer
          minimum: 1
          maximum: 3650
        ipAllowlist: &a12
          type: array
          maxItems: 100
          items: &a2
            type: string
        brandName: &a13
          type: string
          minLength: 1
          maxLength: 80
        brandColor: &a14
          type: string
          pattern: ^#[a-fA-F0-9]{6}$
        sso: &a15
          type: object
          properties:
            issuer: &a3
              type: string
              format: uri
            clientId: *a2
            authorizationUrl: *a3
            tokenUrl: *a3
            jwksUrl: *a3
            required:
              type: boolean
          additionalProperties: false
        updatedAt: *a1
      additionalProperties: false
    EnterpriseContractWrite:
      type: object
      required:
        - version
        - reference
        - status
        - startsAt
        - endsAt
        - slaBp
        - dpaReference
        - dpaSha256
        - retentionDays
        - ipAllowlist
        - brandName
        - brandColor
        - reason
      properties:
        workspaceId: *a4
        version: *a5
        reference: *a6
        status: *a7
        startsAt: *a1
        endsAt: *a1
        slaBp: *a8
        dpaReference: *a9
        dpaSha256: *a10
        retentionDays: *a11
        ipAllowlist: *a12
        brandName: *a13
        brandColor: *a14
        sso: *a15
        updatedAt: *a1
        ssoSecret:
          type: string
          maxLength: 4096
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      additionalProperties: false
    EnterpriseWorkspace:
      type: object
      required:
        - contract
        - apps
      properties:
        contract:
          anyOf:
            - $ref: "#/components/schemas/EnterpriseContract"
            - type: object
              maxProperties: 0
        apps:
          type: array
          items: &a16
            type: object
            additionalProperties: true
      additionalProperties: false
    EnterpriseOverview:
      type: object
      required:
        - nodes
        - database
        - replication
        - contracts
        - sdk
        - evidence
        - reviews
        - failovers
      properties:
        nodes:
          type: array
          items: *a16
        database:
          type: array
          items: *a16
        replication:
          type: array
          items: *a16
        contracts:
          type: array
          items: *a16
        sdk:
          type: array
          items: *a16
        evidence:
          type: array
          items: *a16
        reviews:
          type: array
          items: *a16
        failovers:
          type: array
          items: *a16
    DeveloperKey: {"type":"object","additionalProperties":false,"required":["id","name","prefix","scopes","origins","publicKey","revokedAt","createdAt"],"properties":{"id":{"type":"string","format":"uuid"},"name":{"type":"string"},"prefix":{"type":"string"},"scopes":{"type":"array","items":{"type":"string","enum":["read","write","events"]}},"origins":{"type":"array","items":{"type":"string"}},"publicKey":{"type":"boolean"},"revokedAt":{"type":["string","null"],"format":"date-time"},"createdAt":{"type":"string","format":"date-time"}}}
