  "components": {
    "securitySchemes": {
      "apiKey": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "responses": {
      "Error": {
        "description": "Erreur application/problem+json avec code stable",
        "content": {
          "application/problem+json": {
            "schema": {
              "type": "object",
              "properties": {
                "code": {
                  "type": "string"
                },
                "status": {
                  "type": "integer"
                },
                "title": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "Link": {
        "type": "object",
        "properties": {
          "destination": {
            "type": "string",
            "format": "uri"
          },
          "slug": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "domain": {
            "type": "string"
          }
        }
      },
      "Event": {
        "type": "object",
        "required": [
          "eventId",
          "name"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string",
            "pattern": "^(pageview|lead|sale|signup|subscription|custom:[a-zA-Z0-9_.-]{1,64})$"
          },
          "cid": {
            "type": [
              "string",
              "null"
            ]
          },
          "visitor": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 128
          },
          "value": {
            "type": "number",
            "minimum": 0
          },
          "currency": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[A-Z]{3}$"
          },
          "page": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 2048
          },
          "consent": {
            "type": "boolean"
          },
          "utm": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "source": {
                "type": "string",
                "maxLength": 128
              },
              "medium": {
                "type": "string",
                "maxLength": 128
              },
              "campaign": {
                "type": "string",
                "maxLength": 128
              },
              "term": {
                "type": "string",
                "maxLength": 128
              },
              "content": {
                "type": "string",
                "maxLength": 128
              }
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "name": {
                  "const": "sale"
                }
              },
              "required": [
                "name"
              ]
            },
            "then": {
              "required": [
                "value",
                "currency"
              ]
            }
          }
        ]
      },
      "Qr": {
        "type": "object",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "dynamic",
              "static"
            ]
          },
          "linkId": {
            "type": "string",
            "format": "uuid"
          },
          "contentType": {
            "type": "string"
          },
          "fields": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "title": {
            "type": "string"
          },
          "foreground": {
            "type": "string"
          },
          "background": {
            "type": "string"
          },
          "errorCorrection": {
            "type": "string"
          },
          "margin": {
            "type": "integer"
          }
        }
      },
      "Bio": {
        "type": "object",
        "properties": {
          "slug": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "theme": {
            "type": "string"
          }
        }
      },
      "Domain": {
        "type": "object",
        "properties": {
          "hostname": {
            "type": "string"
          },
          "makeDefault": {
            "type": "boolean"
          },
          "rootRedirectUrl": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          },
          "notFoundUrl": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          }
        }
      },
      "EnterpriseContract": {
        "type": "object",
        "required": [
          "version",
          "reference",
          "status",
          "startsAt",
          "endsAt",
          "slaBp",
          "dpaReference",
          "dpaSha256",
          "retentionDays",
          "ipAllowlist",
          "brandName",
          "brandColor",
          "sso"
        ],
        "properties": {
          "workspaceId": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "reference": {
            "type": "string",
            "minLength": 3,
            "maxLength": 200
          },
          "status": {
            "enum": [
              "active",
              "suspended",
              "expired"
            ]
          },
          "startsAt": {
            "type": "string",
            "format": "date-time"
          },
          "endsAt": {
            "type": "string",
            "format": "date-time"
          },
          "slaBp": {
            "type": "integer",
            "minimum": 9000,
            "maximum": 10000
          },
          "dpaReference": {
            "type": "string",
            "minLength": 3,
            "maxLength": 200
          },
          "dpaSha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "retentionDays": {
            "type": "integer",
            "minimum": 1,
            "maximum": 3650
          },
          "ipAllowlist": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "string"
            }
          },
          "brandName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "brandColor": {
            "type": "string",
            "pattern": "^#[a-fA-F0-9]{6}$"
          },
          "sso": {
            "type": "object",
            "properties": {
              "issuer": {
                "type": "string",
                "format": "uri"
              },
              "clientId": {
                "type": "string"
              },
              "authorizationUrl": {
                "type": "string",
                "format": "uri"
              },
              "tokenUrl": {
                "type": "string",
                "format": "uri"
              },
              "jwksUrl": {
                "type": "string",
                "format": "uri"
              },
              "required": {
                "type": "boolean"
              }
            },
            "additionalProperties": false
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false
      },
      "EnterpriseSettings": {
        "type": "object",
        "required": [
          "workspaceId",
          "contract",
          "apps",
          "manages"
        ],
        "properties": {
          "contract": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/EnterpriseContract"
              },
              {
                "type": "object",
                "maxProperties": 0
              }
            ]
          },
          "apps": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "workspaceId": {
            "type": "string",
            "format": "uuid"
          },
          "manages": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "Problem": {
        "type": "object",
        "required": [
          "status",
          "code"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "code": {
            "type": "string",
            "description": "Code stable (ex. unauthorized, invalid_request, not_found)."
          }
        }
      }
    }
  }
}
