# Surcharge de développement : HTTP simple (*.localhost), Mailpit, journaux lisibles, Flyway au démarrage.
services:
  proxy:
    environment:
      BEEP_SITE: http://${BEEP_DOMAIN}
      BO_SITE: http://dashboard.${BEEP_DOMAIN}
    ports: !override
      - "${HTTP_PORT:-80}:80"
    volumes: !override
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"       # pour les outils SQL (5433 : évite un PostgreSQL local sur 5432)

  mailpit:                                      # boîte de réception factice : http://mail.${BEEP_DOMAIN}
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks: [edge]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  core:
    environment:
      SPRING_PROFILES_ACTIVE: dev        # sans `prod` : journaux lisibles au lieu de JSON
  worker:
    environment:
      SPRING_PROFILES_ACTIVE: dev,worker
      BEEP_ROLLUP_INTERVAL: PT10S        # statistiques visibles en quelques secondes en dev (tests de bout en bout)
  backoffice-api:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  redirector:
    environment:
      SPRING_PROFILES_ACTIVE: dev
